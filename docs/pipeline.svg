<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-labelledby="t d">
<title id="t">Verdict claims pipeline</title>
<desc id="d">A claim enters intake, fans out to a policy agent, a vision agent and an integrity agent, each returning evidence. A deterministic decision engine produces one of five outcomes: settle, request evidence, or escalate. A Code of Practice clock runs across the whole file from notification.</desc>

<style>
  .bg      { fill: #0C222B; }
  .card    { fill: #14323D; stroke: #27505E; stroke-width: 1; }
  .h       { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #E8F0F3; }
  .s       { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #92A9B3; }
  .k       { font: 600 11px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: #6F8894; letter-spacing: .12em; }
  .tag     { font: 600 10.5px ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .1em; }
  .ico     { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wire    { fill: none; stroke: #2B5566; stroke-width: 1.6; }
  .flow    { fill: none; stroke-width: 2.2; stroke-linecap: round;
             stroke-dasharray: 7 11; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -18; } }

  /* Each stage brightens as the claim reaches it, then holds. 9s loop. */
  .lit     { opacity: 0; }
  @keyframes lit { 0%,4% {opacity:0} 10%,86% {opacity:1} 96%,100% {opacity:0} }
  .l1 { animation: lit 9s ease-in-out infinite;              }
  .l2 { animation: lit 9s ease-in-out infinite; animation-delay: 1.1s; }
  .l3 { animation: lit 9s ease-in-out infinite; animation-delay: 2.4s; }
  .l4 { animation: lit 9s ease-in-out infinite; animation-delay: 3.9s; }

  @keyframes glow { 0%,100% { opacity:.30 } 50% { opacity:.75 } }
  .pulse { animation: glow 2.6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .flow  { animation: none; stroke-dasharray: none; opacity: .55; }
    .lit   { opacity: 1; animation: none; }
    .pulse { animation: none; opacity: .6; }
    .dot   { display: none; }
  }
</style>

<rect class="bg" width="1160" height="600" rx="18"/>

<!-- ───────── Code clock rail ───────── -->
<g>
  <text class="k" x="40" y="46">CODE CLOCK · RUNS ON EVERY FILE FROM NOTIFICATION</text>
  <rect x="40" y="60" width="1080" height="5" rx="2.5" fill="#1D3F4C"/>
  <rect x="40" y="60" width="1080" height="5" rx="2.5" fill="#34D399" opacity=".16"/>
  <rect x="40" y="60" height="5" rx="2.5" fill="#34D399">
    <animate attributeName="width" values="0;300;760;1080;1080" keyTimes="0;.28;.62;.88;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text class="s" x="1120" y="46" text-anchor="end">4 months · 10 business days · 30 day IDR</text>
</g>

<!-- ───────── wires ───────── -->
<g class="wire">
  <path d="M232 300 C 268 300, 268 158, 300 158"/>
  <path d="M232 300 H 300"/>
  <path d="M232 300 C 268 300, 268 442, 300 442"/>
  <path d="M540 158 C 578 158, 578 300, 616 300"/>
  <path d="M540 300 H 616"/>
  <path d="M540 442 C 578 442, 578 300, 616 300"/>
  <path d="M836 300 C 868 300, 868 168, 900 168"/>
  <path d="M836 300 H 900"/>
  <path d="M836 300 C 868 300, 868 432, 900 432"/>
</g>

<!-- animated flow, coloured by what each branch carries -->
<g>
  <path class="flow" style="stroke:#C084FC" d="M232 300 C 268 300, 268 158, 300 158"/>
  <path class="flow" style="stroke:#C084FC" d="M232 300 H 300"/>
  <path class="flow" style="stroke:#C084FC" d="M232 300 C 268 300, 268 442, 300 442"/>
  <path class="flow" style="stroke:#5EC6D8" d="M540 158 C 578 158, 578 300, 616 300"/>
  <path class="flow" style="stroke:#5EC6D8" d="M540 300 H 616"/>
  <path class="flow" style="stroke:#5EC6D8" d="M540 442 C 578 442, 578 300, 616 300"/>
  <path class="flow" style="stroke:#34D399" d="M836 300 C 868 300, 868 168, 900 168"/>
  <path class="flow" style="stroke:#FBBF24" d="M836 300 H 900"/>
  <path class="flow" style="stroke:#FB7185" d="M836 300 C 868 300, 868 432, 900 432"/>
</g>

<!-- travelling claim -->
<g class="dot">
  <circle r="4.5" fill="#E8F0F3">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.06;.30;1" calcMode="linear"
      path="M232 300 H 300"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.07;.29;.32;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#E8F0F3">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.40;.62;1" calcMode="linear"
      path="M540 300 H 616"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.40;.42;.61;.64;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#34D399">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.70;.90;1" calcMode="linear"
      path="M836 300 C 868 300, 868 168, 900 168"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.70;.72;.89;.92" dur="9s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- ───────── intake ───────── -->
<g>
  <rect class="card" x="40" y="248" width="192" height="104" rx="14"/>
  <rect class="lit l1" x="40" y="248" width="192" height="104" rx="14" fill="none" stroke="#C084FC" stroke-width="1.6"/>
  <g class="ico" stroke="#C084FC" transform="translate(62,272)">
    <path d="M1 4.5A2 2 0 0 1 3 2.5h9l4 4v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z"/>
    <path d="M12 2.5v4h4M5 11h8M5 15h6"/>
  </g>
  <text class="h" x="94" y="288">Claim intake</text>
  <text class="s" x="62" y="322">documents, photos, email</text>
  <text class="s" x="62" y="340">structured facts out</text>
</g>

<!-- ───────── agents ───────── -->
<g>
  <text class="k" x="300" y="98">EVIDENCE · NEVER A VERDICT</text>

  <rect class="card" x="300" y="118" width="240" height="80" rx="14"/>
  <rect class="lit l2" x="300" y="118" width="240" height="80" rx="14" fill="none" stroke="#5EC6D8" stroke-width="1.6"/>
  <g class="ico" stroke="#5EC6D8" transform="translate(320,140)">
    <path d="M2 3h7a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H2z"/>
    <path d="M18 3h-3a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H18z"/>
  </g>
  <text class="h" x="352" y="152">Policy agent</text>
  <text class="s" x="320" y="182">wording at the date of loss</text>

  <rect class="card" x="300" y="260" width="240" height="80" rx="14"/>
  <rect class="lit l2" x="300" y="260" width="240" height="80" rx="14" fill="none" stroke="#5EC6D8" stroke-width="1.6"/>
  <g class="ico" stroke="#5EC6D8" transform="translate(320,282)">
    <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/>
    <circle cx="10" cy="10" r="2.6"/>
  </g>
  <text class="h" x="352" y="294">Vision agent</text>
  <text class="s" x="320" y="324">damaged parts, severity band</text>

  <rect class="card" x="300" y="402" width="240" height="80" rx="14"/>
  <rect class="lit l2" x="300" y="402" width="240" height="80" rx="14" fill="none" stroke="#5EC6D8" stroke-width="1.6"/>
  <g class="ico" stroke="#5EC6D8" transform="translate(320,424)">
    <path d="M10 1.5 2.5 4.8v5.4c0 4.4 3.1 7.7 7.5 8.9 4.4-1.2 7.5-4.5 7.5-8.9V4.8z"/>
    <path d="M7.2 10.2l2 2 3.6-3.9"/>
  </g>
  <text class="h" x="352" y="436">Integrity agent</text>
  <text class="s" x="320" y="466">within-claim discrepancies</text>
</g>

<!-- ───────── engine ───────── -->
<g>
  <rect x="608" y="228" width="236" height="144" rx="16" fill="#34D399" opacity=".07" class="pulse"/>
  <rect class="card" x="616" y="236" width="220" height="128" rx="14"/>
  <rect class="lit l3" x="616" y="236" width="220" height="128" rx="14" fill="none" stroke="#34D399" stroke-width="1.8"/>
  <g class="ico" stroke="#34D399" transform="translate(638,262)">
    <path d="M10 1.8v3M10 15.2v3M18.2 10h-3M4.8 10h-3M15.8 4.2l-2.1 2.1M6.3 13.7l-2.1 2.1M15.8 15.8l-2.1-2.1M6.3 6.3 4.2 4.2"/>
    <circle cx="10" cy="10" r="3.4"/>
  </g>
  <text class="h" x="670" y="278">Decision engine</text>
  <text class="s" x="638" y="310">deterministic · no model call</text>
  <text class="s" x="638" y="330">seven gates · five outcomes</text>
  <rect x="638" y="342" width="88" height="17" rx="4" fill="#34D399" opacity=".16"/>
  <text class="tag" x="646" y="354" fill="#34D399">REPRODUCIBLE</text>
</g>

<!-- ───────── outcomes ───────── -->
<g>
  <text class="k" x="900" y="98">OUTCOME · WITH A REASONS RECORD</text>

  <rect class="card" x="900" y="128" width="220" height="80" rx="14"/>
  <rect class="lit l4" x="900" y="128" width="220" height="80" rx="14" fill="none" stroke="#34D399" stroke-width="1.6"/>
  <g class="ico" stroke="#34D399" transform="translate(920,150)">
    <circle cx="10" cy="10" r="8.4"/><path d="M6.2 10.2l2.6 2.6 5-5.4"/>
  </g>
  <text class="h" x="952" y="162">Settle</text>
  <text class="s" x="920" y="192">repairer booked or cash paid</text>

  <rect class="card" x="900" y="260" width="220" height="80" rx="14"/>
  <rect class="lit l4" x="900" y="260" width="220" height="80" rx="14" fill="none" stroke="#FBBF24" stroke-width="1.6"/>
  <g class="ico" stroke="#FBBF24" transform="translate(920,282)">
    <path d="M18 10a8 8 0 1 1-2.6-5.9"/><path d="M18.4 2.6v4.8h-4.8"/>
  </g>
  <text class="h" x="952" y="294">Request evidence</text>
  <text class="s" x="920" y="324">loops back, re-runs on arrival</text>

  <rect class="card" x="900" y="392" width="220" height="80" rx="14"/>
  <rect class="lit l4" x="900" y="392" width="220" height="80" rx="14" fill="none" stroke="#FB7185" stroke-width="1.6"/>
  <g class="ico" stroke="#FB7185" transform="translate(920,414)">
    <path d="M10 2.2 1.4 17.2h17.2z"/><path d="M10 8v3.6M10 14.4h.01"/>
  </g>
  <text class="h" x="952" y="426">Escalate</text>
  <text class="s" x="920" y="456">a person decides in 90 seconds</text>
</g>

<!-- ───────── footer rule ───────── -->
<g>
  <text class="s" x="40" y="560" fill="#6F8894">Agents return evidence. The engine returns verdicts. Nothing else does.</text>
  <text class="k" x="1120" y="560" text-anchor="end">ADR-0002</text>
</g>
</svg>
